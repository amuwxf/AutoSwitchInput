<svg width="760" height="600" viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dde6"/>
      <stop offset="1" stop-color="#c3ccd9"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54545c"/>
      <stop offset="1" stop-color="#2e2e34"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#e9edf3" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1d2733" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- desktop -->
  <rect width="760" height="600" fill="url(#desktop)"/>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="20" y="20" width="720" height="560" rx="16" fill="url(#win)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- header -->
  <rect x="48" y="48" width="44" height="44" rx="10" fill="url(#iconbg)"/>
  <g transform="translate(62,62)" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="16" height="11" rx="2.5"/>
    <line x1="3.5" y1="15" x2="3.5" y2="17.5"/>
    <line x1="12.5" y1="15" x2="12.5" y2="17.5"/>
    <line x1="8" y1="15" x2="8" y2="17.5"/>
    <line x1="3.5" y1="13.5" x2="12.5" y2="13.5"/>
  </g>
  <text x="104" y="68" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">AutoSwitchInput</text>
  <text x="104" y="88" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b70">按应用自动切换输入法</text>

  <!-- general card -->
  <rect x="40" y="118" width="680" height="196" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
  <text x="64" y="148" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8a8a8f" letter-spacing="0.4">通用</text>

  <text x="64" y="186" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1d1d1f">启用自动切换</text>
  <text x="64" y="206" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">切换应用时，按规则自动匹配输入法</text>
  <rect x="648" y="172" width="44" height="26" rx="13" fill="#4c4c52"/>
  <circle cx="681" cy="185" r="10" fill="#ffffff"/>

  <line x1="64" y1="226" x2="696" y2="226" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>

  <text x="64" y="258" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1d1d1f">默认输入法</text>
  <rect x="620" y="242" width="72" height="26" rx="7" fill="#ffffff" fill-opacity="0.85" stroke="#000000" stroke-opacity="0.12"/>
  <text x="632" y="259" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1f">ABC ▾</text>

  <line x1="64" y1="282" x2="696" y2="282" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>

  <text x="64" y="312" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1d1d1f">开机启动</text>
  <text x="64" y="332" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#8a8a8f">登录系统后自动运行本应用</text>
  <rect x="648" y="298" width="44" height="26" rx="13" fill="#e3e3e8"/>
  <circle cx="661" cy="311" r="10" fill="#ffffff"/>

  <!-- rules card -->
  <rect x="40" y="334" width="680" height="208" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
  <text x="64" y="364" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8a8a8f" letter-spacing="0.4">应用规则</text>

  <!-- rule row 1 -->
  <rect x="60" y="380" width="640" height="50" rx="10" fill="#ffffff" fill-opacity="0.55" stroke="#000000" stroke-opacity="0.06"/>
  <rect x="72" y="392" width="26" height="26" rx="6" fill="#1e1e1e"/>
  <text x="110" y="400" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Terminal</text>
  <text x="110" y="416" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#9a9aa0">com.apple.Terminal</text>
  <rect x="600" y="393" width="64" height="24" rx="6" fill="#ffffff" fill-opacity="0.9" stroke="#000000" stroke-opacity="0.12"/>
  <text x="610" y="409" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f">ABC ▾</text>
  <text x="680" y="409" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#b0b0b5">🗑</text>

  <!-- rule row 2 -->
  <rect x="60" y="440" width="640" height="50" rx="10" fill="#ffffff" fill-opacity="0.55" stroke="#000000" stroke-opacity="0.06"/>
  <rect x="72" y="452" width="26" height="26" rx="6" fill="#2ba34a"/>
  <text x="110" y="460" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">WeChat</text>
  <text x="110" y="476" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#9a9aa0">com.tencent.xinWeChat</text>
  <rect x="600" y="453" width="72" height="24" rx="6" fill="#ffffff" fill-opacity="0.9" stroke="#000000" stroke-opacity="0.12"/>
  <text x="608" y="469" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1f">Pinyin ▾</text>
  <text x="680" y="469" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#b0b0b5">🗑</text>

  <!-- add rule button -->
  <rect x="60" y="504" width="120" height="30" rx="8" fill="#4c4c52"/>
  <text x="104" y="524" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#ffffff">+ 添加规则</text>

  <text x="380" y="588" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#7a7a80">示意图 / Mockup — 以实际运行效果为准</text>
</svg>
